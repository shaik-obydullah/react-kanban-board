services:
  mongo:
    image: mongo:7
    container_name: trailo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - trailo-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: trailo-server
    ports:
      - "5001:5001"
    depends_on:
      - mongo
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/trailo
      JWT_SECRET: trailo_jwt_secret_key_2026
      CLIENT_URL: http://localhost:5174
    volumes:
      - ./server:/app
      - /app/node_modules
    networks:
      - trailo-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: trailo-client
    ports:
      - "5174:5174"
    depends_on:
      - server
    environment:
      VITE_API_URL: http://localhost:5001/api
      VITE_SOCKET_URL: http://localhost:5001
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/dist
    networks:
      - trailo-net

volumes:
  mongo_data:

networks:
  trailo-net:
    driver: bridge
